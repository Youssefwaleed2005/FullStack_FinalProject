<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Andalusia Academy — professional courses, programs and career paths."
    />
    <title>Andalusia Academy</title>
    <script>
      // Apply the saved theme (or the system setting) before the first paint, so dark mode
      // does not flash white. ThemeProvider takes over from here; same key as THEME_KEY.
      try {
        var theme = localStorage.getItem("andalusia.theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
